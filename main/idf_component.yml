## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.0.0'
  joltwallet/littlefs: "==1.20.4"
  # Required by the prebuilt seekaudio_aec component when the library was built
  # with its ESP-DSP FFT option (the default delivery). Harmless otherwise.
  espressif/esp-dsp: "^1.5.0"

  # The B1/B2 reference configs use the esp-sr Full-Duplex AEC
  # (AEC_MODE_FD / aec_linear_process / aec_nlp_process), which exists ONLY on
  # esp-sr git master -- it is NOT in any tagged release (2.1.5 / 2.2.0 / 2.2.2
  # all lack AEC_MODE_FD).
  espressif/esp-sr:
    git: https://github.com/espressif/esp-sr.git
    version: master
    # For a reproducible build you can pin to a known commit instead:
    #   version: 7ff63a7
